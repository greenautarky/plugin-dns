# GA armv7 rebuild of the upstream dns plugin (T4, Odoo #708).
#
# Upstream's master Dockerfile hard-fails on armv7 — the arch survives only as
# already-published tags. This workflow rebuilds the pinned upstream tag's
# source for armv7 under the greenautarky namespace, gated the same way as the
# add-on/core pipelines: /init smoke (no entrypoint override — the exec-bit
# lesson), CVE gate that fails closed on zero coverage, and a
# tag-must-match-env guard so a stray dispatch cannot mint a surprise version.
#
# version == docker tag == io.hass.version label (the flasher-addon lesson:
# the Supervisor uses the version string as the pull tag and reads the label
# for its already-installed check).
#
# A pull request runs the same build, smoke and CVE gate WITHOUT publishing,
# and keeps the built image as a short-lived workflow artifact so it can be
# inspected before a release is cut. Publishing stays a workflow_dispatch.
name: Build GA armv7 dns plugin

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Must equal PUBLISH_VERSION below (guard against accidental minting)"
        required: true
  pull_request:
    branches: [ga-armv7]

env:
  PUBLISH_VERSION: "2026.09.1"
  UPSTREAM_VERSION: "2026.09.0"
  COREDNS_VERSION: "1.14.7"
  # Digest-pinned: :3.22 is a floating tag that has already moved once
  # (rule 61 — two sources agreeing by luck; pin removes the second source).
  BUILD_FROM: "ghcr.io/home-assistant/armv7-base:3.22@sha256:ae2b8be31fee7bd01078d5ca51e7c48aa323ccbaca8085420a416e354b101246"
  IMAGE: "ghcr.io/greenautarky/armv7-hassio-dns"

permissions:
  contents: read
  packages: write

jobs:
  build-prove-push:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - release_tag must match the pinned version
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.release_tag }}" != "${PUBLISH_VERSION}" ]; then
            echo "::error::release_tag '${{ inputs.release_tag }}' != pinned PUBLISH_VERSION '${PUBLISH_VERSION}' - refusing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build (armv7, upstream source at parity)
        run: |
          docker buildx build --platform linux/arm/v7 --load \
            --build-arg BUILD_FROM="${BUILD_FROM}" \
            --build-arg BUILD_ARCH=armv7 \
            --build-arg COREDNS_VERSION="${COREDNS_VERSION}" \
            --label io.hass.type=dns \
            --label io.hass.arch=armv7 \
            --label io.hass.version="${PUBLISH_VERSION}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.version="${PUBLISH_VERSION}" \
            --label ga.upstream.version="${UPSTREAM_VERSION}" \
            -t "${IMAGE}:${PUBLISH_VERSION}" .

      - name: Prove - the binary is the pinned CoreDNS, built for linux/arm
        run: |
          out=$(docker run --rm --platform linux/arm/v7 --entrypoint /usr/bin/coredns \
            "${IMAGE}:${PUBLISH_VERSION}" -version)
          echo "$out"
          echo "$out" | grep -qx "CoreDNS-${COREDNS_VERSION}" \
            || { echo "::error::binary is not CoreDNS-${COREDNS_VERSION}"; exit 1; }
          echo "$out" | grep -q "linux/arm," \
            || { echo "::error::binary is not linux/arm"; exit 1; }
          plugins=$(docker run --rm --platform linux/arm/v7 --entrypoint /usr/bin/coredns \
            "${IMAGE}:${PUBLISH_VERSION}" -plugins)
          # Every plugin the rendered Corefile uses must be compiled in.
          # (CoreDNS >= 1.12 prints bare names; 1.11 printed "  dns.<name>".)
          for p in log errors loop debug hosts template mdns forward fallback cache; do
            echo "$plugins" | grep -qxE "(  dns\.)?$p" \
              || { echo "::error::plugin dns.$p missing from the binary"; echo "$plugins"; exit 1; }
          done
          echo "all 10 Corefile plugins present"

      - name: Smoke - /init boot, no entrypoint override (the exec-bit class)
        run: |
          mkdir -p /tmp/dnscfg
          echo '{"servers":["dns://1.1.1.1"],"locals":["dns://1.0.0.1"],"debug":false,"fallback":false}' > /tmp/dnscfg/coredns.json
          docker run -d --name smoke --platform linux/arm/v7 \
            -v /tmp/dnscfg:/config "${IMAGE}:${PUBLISH_VERSION}"
          sleep 15
          state=$(docker inspect smoke --format '{{.State.Status}}')
          echo "state=$state"
          docker logs smoke 2>&1 | tail -20
          if docker logs smoke 2>&1 | grep -qiE "permission denied|exited 126"; then
            echo "::error::exec-bit class failure in /init boot"; exit 1
          fi
          [ "$state" = "running" ] || { echo "::error::container not running"; exit 1; }
          docker exec smoke sh -c 'pgrep coredns >/dev/null' || { echo "::error::coredns not running under s6"; exit 1; }
          docker rm -f smoke

      - name: Prove - the tempio-rendered Corefile parses and answers (two option sets)
        run: |
          # The Supervisor writes coredns.json and /config/hosts; corefile.sh renders
          # /etc/corefile with tempio and falls back to the static file on failure.
          # Assert the RENDERED file is what runs, that CoreDNS parsed it, and that it
          # answers from the hosts plugin. A user-defined network, like the
          # Supervisor's "hassio" network, so Docker's embedded DNS sits behind
          # 127.0.0.11 (the default when no locals are set); on the default bridge
          # CoreDNS itself would own 127.0.0.11:53 and loop correctly fires.
          docker network create dnsproof >/dev/null
          run_case() {
            name=$1; json=$2; want=$3
            dir=/tmp/dnscase-$name; mkdir -p "$dir"
            echo "$json" > "$dir/coredns.json"
            printf '172.30.32.2 supervisor supervisor.local.hass.io\n' > "$dir/hosts"
            docker run -d --name "dns-$name" --platform linux/arm/v7 --network dnsproof \
              -v "$dir:/config" "${IMAGE}:${PUBLISH_VERSION}"
            sleep 20
            logs=$(docker logs "dns-$name" 2>&1)
            echo "----- $name: logs"; echo "$logs" | tail -25
            echo "----- $name: /etc/corefile"; docker exec "dns-$name" cat /etc/corefile
            [ "$(docker inspect "dns-$name" --format '{{.State.Status}}')" = running ] \
              || { echo "::error::$name: container not running"; return 1; }
            if echo "$logs" | grep -q "Corefile fails to generate"; then
              echo "::error::$name: tempio render failed, static fallback corefile in use"; return 1
            fi
            if echo "$logs" | grep -qiE "\[FATAL\]|panic|plugin/loop: Loop|Error during parsing"; then
              echo "::error::$name: CoreDNS fatal/parse/loop error"; return 1
            fi
            echo "$logs" | grep -q "CoreDNS-${COREDNS_VERSION}" \
              || { echo "::error::$name: CoreDNS-${COREDNS_VERSION} did not report startup"; return 1; }
            docker exec "dns-$name" grep -q -- "$want" /etc/corefile \
              || { echo "::error::$name: rendered corefile lacks '$want'"; return 1; }
            ans=$(docker exec "dns-$name" nslookup supervisor.local.hass.io 127.0.0.1 2>&1)
            echo "$ans"
            echo "$ans" | grep -q "172.30.32.2" \
              || { echo "::error::$name: hosts record not answered"; return 1; }
            docker rm -f "dns-$name" >/dev/null
          }
          run_case default \
            '{"servers":["dns://1.1.1.1"],"locals":["dns://1.0.0.1"],"debug":false,"fallback":true}' \
            'fallback REFUSED,SERVFAIL,NXDOMAIN'
          run_case debug \
            '{"servers":["dns://1.1.1.1"],"locals":[],"debug":true,"fallback":false}' \
            'dns://127.0.0.11'
          echo "both rendered Corefiles parsed and answered"

      - name: CVE gate (fail closed on zero coverage, budget-pinned)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --format json --output /tmp/scan.json "${IMAGE}:${PUBLISH_VERSION}"
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/scan.json"))
          pkgs = sum(len(r.get("Vulnerabilities") or []) + 1 for r in d.get("Results", []))
          counts = {}
          for r in d.get("Results", []):
              for v in r.get("Vulnerabilities") or []:
                  counts[v["Severity"]] = counts.get(v["Severity"], 0) + 1
          total_results = len(d.get("Results", []))
          print(f"results={total_results} counts={counts}")
          if total_results == 0:
              raise SystemExit("COVERAGE ZERO - a scan that inspected nothing is a failure, not a pass")
          # Budget = measured at fork time ON THIS GATE'S SCAN BASIS (full trivy
          # incl. gobinary: C7/H124 — the local pre-scan used a narrower basis,
          # first run proved the difference). Gate against regression, not zero.
          # The fork-time load lived in CoreDNS 1.11.4's Go deps; 2026.09.1 moves
          # to CoreDNS 1.14.7. The budget stays a regression ceiling.
          if counts.get("CRITICAL", 0) > 7 or counts.get("HIGH", 0) > 124:
              raise SystemExit(f"CVE budget exceeded: {counts}")
          PY

      - name: Keep the built image (pull request only, not a release)
        if: github.event_name == 'pull_request'
        run: docker save "${IMAGE}:${PUBLISH_VERSION}" -o "armv7-hassio-dns_${PUBLISH_VERSION}.tar"

      - name: Upload the built image
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: armv7-hassio-dns-image
          path: armv7-hassio-dns_${{ env.PUBLISH_VERSION }}.tar
          retention-days: 7

      - name: Push
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE}:${PUBLISH_VERSION}"
