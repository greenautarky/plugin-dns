# GA armv7 rebuild of the upstream dns plugin (T4, Odoo #708).
#
# Upstream's master Dockerfile hard-fails on armv7 — the arch survives only as
# already-published tags. This workflow rebuilds the pinned upstream tag's
# source for armv7 under the greenautarky namespace, gated the same way as the
# add-on/core pipelines: /init smoke (no entrypoint override — the exec-bit
# lesson), CVE gate that fails closed on zero coverage, and a
# tag-must-match-env guard so a stray dispatch cannot mint a surprise version.
#
# version == docker tag == io.hass.version label (the flasher-addon lesson:
# the Supervisor uses the version string as the pull tag and reads the label
# for its already-installed check).
name: Build GA armv7 dns plugin

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Must equal PUBLISH_VERSION below (guard against accidental minting)"
        required: true

env:
  PUBLISH_VERSION: "2025.08.1"
  UPSTREAM_VERSION: "2025.08.0"
  COREDNS_VERSION: "1.11.4"
  # Digest-pinned: :3.22 is a floating tag that has already moved once
  # (rule 61 — two sources agreeing by luck; pin removes the second source).
  BUILD_FROM: "ghcr.io/home-assistant/armv7-base:3.22@sha256:ae2b8be31fee7bd01078d5ca51e7c48aa323ccbaca8085420a416e354b101246"
  IMAGE: "ghcr.io/greenautarky/armv7-hassio-dns"

permissions:
  contents: read
  packages: write

jobs:
  build-prove-push:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - release_tag must match the pinned version
        run: |
          if [ "${{ inputs.release_tag }}" != "${PUBLISH_VERSION}" ]; then
            echo "::error::release_tag '${{ inputs.release_tag }}' != pinned PUBLISH_VERSION '${PUBLISH_VERSION}' - refusing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build (armv7, upstream source at parity)
        run: |
          docker buildx build --platform linux/arm/v7 --load \
            --build-arg BUILD_FROM="${BUILD_FROM}" \
            --build-arg BUILD_ARCH=armv7 \
            --build-arg COREDNS_VERSION="${COREDNS_VERSION}" \
            --label io.hass.type=dns \
            --label io.hass.arch=armv7 \
            --label io.hass.version="${PUBLISH_VERSION}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.version="${PUBLISH_VERSION}" \
            --label ga.upstream.version="${UPSTREAM_VERSION}" \
            -t "${IMAGE}:${PUBLISH_VERSION}" .

      - name: Smoke - /init boot, no entrypoint override (the exec-bit class)
        run: |
          mkdir -p /tmp/dnscfg
          echo '{"servers":["dns://1.1.1.1"],"locals":["dns://1.0.0.1"],"debug":false,"fallback":false}' > /tmp/dnscfg/coredns.json
          docker run -d --name smoke --platform linux/arm/v7 \
            -v /tmp/dnscfg:/config "${IMAGE}:${PUBLISH_VERSION}"
          sleep 15
          state=$(docker inspect smoke --format '{{.State.Status}}')
          echo "state=$state"
          docker logs smoke 2>&1 | tail -20
          if docker logs smoke 2>&1 | grep -qiE "permission denied|exited 126"; then
            echo "::error::exec-bit class failure in /init boot"; exit 1
          fi
          [ "$state" = "running" ] || { echo "::error::container not running"; exit 1; }
          docker exec smoke sh -c 'pgrep coredns >/dev/null' || { echo "::error::coredns not running under s6"; exit 1; }
          docker rm -f smoke

      - name: CVE gate (fail closed on zero coverage, budget-pinned)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --format json --output /tmp/scan.json "${IMAGE}:${PUBLISH_VERSION}"
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/scan.json"))
          pkgs = sum(len(r.get("Vulnerabilities") or []) + 1 for r in d.get("Results", []))
          counts = {}
          for r in d.get("Results", []):
              for v in r.get("Vulnerabilities") or []:
                  counts[v["Severity"]] = counts.get(v["Severity"], 0) + 1
          total_results = len(d.get("Results", []))
          print(f"results={total_results} counts={counts}")
          if total_results == 0:
              raise SystemExit("COVERAGE ZERO - a scan that inspected nothing is a failure, not a pass")
          # Budget = measured at fork time (C4/H69). Gate against regression, not zero.
          if counts.get("CRITICAL", 0) > 4 or counts.get("HIGH", 0) > 75:
              raise SystemExit(f"CVE budget exceeded: {counts}")
          PY

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE}:${PUBLISH_VERSION}"
